server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  ai:
    openai:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:openrouter/free}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./code-review-data;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  github-token: ${GITHUB_TOKEN:}
  max-paste-chars: 100000
  max-archive-bytes: 20000000
  max-files: 300
  max-file-bytes: 200000
  max-total-source-bytes: 5000000
