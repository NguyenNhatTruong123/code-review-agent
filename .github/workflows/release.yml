name: Release build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend modules
        run: mvn -B -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: code-review-web
        run: |
          npm install
          npm run build

      - name: Generate API documentation
        run: mvn -B javadoc:aggregate

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-review-agent-${{ github.ref_name }}
          path: |
            code-review-api/target/*.jar
            code-review-web/dist
            target/site/apidocs
          if-no-files-found: error
