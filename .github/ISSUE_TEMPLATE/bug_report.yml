name: Bug report
description: Report a reproducible problem in the code review agent.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, session cookies, private source code, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the API and frontend.
        2. Open ...
        3. Submit ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Java version, Maven version, Node.js version, and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, credentials, cookies, source code, and personal data.
      render: text
